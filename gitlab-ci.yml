# Wiz Runtime Sensor on OpenShift (on-prem)
#
# Flow:  validate -> render -> deploy -> verify
#   validate, render   every merge request and every commit on the default branch
#   deploy, verify     manual, default branch only, one job per cluster, gated by GitLab environments
#
# The Wiz credential comes from CyberArk. Cluster tokens are CI/CD variables. Nothing secret is in Git.

stages:
  - validate
  - render
  - deploy
  - verify

variables:
  WIZ_NAMESPACE: "wiz"
  HELM_RELEASE: "wiz-sensor"
  # Point this at the internal Helm proxy if runners cannot reach charts.wiz.io.
  # The public index serves chart archives from wiz-sec.github.io, so both hosts are needed without a proxy.
  WIZ_HELM_REPO_URL: "https://charts.wiz.io/"
  WIZ_CHART: "wiz-sensor"
  # Pinned on purpose. Bump through a merge request and review the render job diff.
  WIZ_CHART_VERSION: "1.0.13112"
  HELM_TIMEOUT: "15m"
  # Space-separated overlay names from helm/values/optional, for example "proxy pull-secret".
  # Override per cluster with an environment-scoped CI/CD variable of the same name.
  EXTRA_VALUES: ""
  # external = wiz-api-token is synced from CyberArk by the External Secrets Operator (standard).
  # ci       = fallback, written from the masked variables WIZ_CLIENT_ID / WIZ_CLIENT_SECRET.
  SECRETS_MODE: "external"

default:
  # Internal image that provides: bash, helm >= 3.11, oc, skopeo, yamllint, shellcheck.
  image: "<CI_TOOLS_IMAGE>"
  tags:
    - "<RUNNER_TAG>"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# One entry per file in helm/values/clusters (file name without .yaml).
.clusters:
  parallel:
    matrix:
      - CLUSTER:
          - "nonprod-example"

.default-branch-manual:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual

lint:
  stage: validate
  script:
    - yamllint -c .yamllint.yml .gitlab-ci.yml helm manifests
    - shellcheck -x -P scripts scripts/*.sh
    - scripts/check-placeholders.sh

render:
  stage: render
  extends: .clusters
  script:
    - scripts/render.sh
  artifacts:
    name: "rendered-$CLUSTER"
    paths:
      - rendered/
    expire_in: 30 days

deploy:
  stage: deploy
  extends:
    - .clusters
    - .default-branch-manual
  # Environment-scoped variables: OPENSHIFT_API_URL, OPENSHIFT_TOKEN, optional OPENSHIFT_CA_FILE.
  # The Wiz credential is not a CI variable. It is synced from CyberArk (manifests/external-secrets).
  environment:
    name: openshift/$CLUSTER
  resource_group: wiz-$CLUSTER
  script:
    - scripts/oc-login.sh
    - scripts/deploy.sh
    - scripts/validate.sh

verify:
  stage: verify
  extends:
    - .clusters
    - .default-branch-manual
  environment:
    name: openshift/$CLUSTER
    action: verify
  script:
    - scripts/oc-login.sh
    - scripts/validate.sh
  allow_failure: true
