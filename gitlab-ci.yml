# Wiz Runtime Sensor -> OpenShift (Helm). Sensor only.
stages:
  - lint
  - deploy

variables:
  DEPLOY_VARIABLE:
    value: "development"
    options:
      - "development"
      - "testing"
      - "staging"
      - "staging-dr"
      - "production"
      - "production-dr"
    description: "Target OpenShift environment"
  HELM_REPO_URL: "https://artifactory.fcbint.net/artifactory/cloudsecurity-wiz-helm-remote/"
  CHART_VERSION: "1.0.13112"

default:
  image: artifactory.fcbint.net/container-factory/tools/openshift-helm/openshift-helm:4.18.37-0
  before_script:
    - helm repo add wiz-sec "$HELM_REPO_URL"
    - helm repo update

lint:
  stage: lint
  script:
    - helm template wiz-sensor wiz-sec/wiz-sensor --version "$CHART_VERSION" -f values.yaml

deploy:
  stage: deploy
  when: manual
  environment:
    name: $DEPLOY_VARIABLE
  # OSE_HOST_URL, OSE_USERNAME, OSE_PASSWORD, OSE_PROJECT_NAME are the environment-scoped group variables.
  script:
    - oc login "$OSE_HOST_URL" --username "$OSE_USERNAME" --password "$OSE_PASSWORD"
    - oc -n "$OSE_PROJECT_NAME" apply -f externalsecret.yaml
    - oc -n "$OSE_PROJECT_NAME" wait externalsecret/wiz-api-token --for=condition=Ready --timeout=120s
    - >
      helm upgrade --install wiz-sensor wiz-sec/wiz-sensor
      --version "$CHART_VERSION"
      --namespace "$OSE_PROJECT_NAME"
      -f values.yaml
      --set sensorClusterName="fcb-ose-$DEPLOY_VARIABLE"
      --wait --timeout 10m
    - oc -n "$OSE_PROJECT_NAME" get daemonset,pods -o wide
