# Enable when the internal registry requires credentials and the cluster global pull secret
# (openshift-config/pull-secret) does not already cover it.
# Requires CI variables PRIVATE_REGISTRY, PRIVATE_REGISTRY_USERNAME and PRIVATE_REGISTRY_PASSWORD.
# scripts/create-secrets.sh then creates the wiz-private-registry Secret.
#
# The Sensor only attaches pull secrets when imagePullSecret.required is true,
# so both blocks below are needed.

global:
  imagePullSecrets:
    - name: wiz-private-registry

wiz-sensor:
  imagePullSecret:
    required: true
    create: false
    name: wiz-private-registry
