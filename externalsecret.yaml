# Pulls the Wiz Client ID and Client Secret from CyberArk into the wiz-api-token Secret.
# Take the store name and the remoteRef format from the FCB External Secrets setup page.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wiz-api-token
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: "<CYBERARK_SECRET_STORE>"
  target:
    name: wiz-api-token
  data:
    - secretKey: clientId        # key names required by the Wiz chart
      remoteRef:
        key: "<CYBERARK_PATH_CLIENT_ID>"
    - secretKey: clientToken
      remoteRef:
        key: "<CYBERARK_PATH_CLIENT_SECRET>"
